<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="stil.css">
<style>
  body { --w: 1080px; --h: 1920px; background: var(--yesil); color: var(--krem); }
  .ust { top: 150px; }
  h1 { position: absolute; top: 260px; left: var(--kenar); right: var(--kenar); font-size: 140px; color: var(--krem); }
  h1 em { font-style: normal; color: var(--yesil); background: var(--krem); padding: 0 18px 6px; border-radius: 24px; margin-left: -6px; display: inline-block; margin-top: 14px; }
  .kartlar { position: absolute; top: 810px; left: var(--kenar); right: var(--kenar); display: grid; gap: 16px; }
  .kart { display: flex; gap: 28px; align-items: center; background: var(--yesil-k); border-radius: 32px; padding: 30px 34px; }
  .kart i { font-style: normal; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 54px; color: #ffb38a; width: 44px; }
  .kart b { font-size: 38px; font-weight: 700; display: block; letter-spacing: -0.01em; }
  .kart span { font-size: 27px; opacity: .72; }
  .tilki { width: 500px; left: -30px; top: 1320px; }
  .cagri { position: absolute; right: var(--kenar); top: 1380px; width: 480px; background: var(--krem); color: var(--murekkep); border-radius: 40px 40px 40px 10px; padding: 34px 38px; }
  .cagri b { font-family: 'Bricolage Grotesque'; font-size: 46px; font-weight: 800; letter-spacing: -0.02em; display: block; color: var(--yesil-k); }
  .cagri span { font-size: 26px; color: #4d5a52; display: block; margin-top: 8px; line-height: 1.35; }
</style></head>
<body data-w="1080" data-h="1920">
<div class="ust"><img src="../../../maskot/marka/logo-yatay-koyu-zemin.png" alt="SıraGO"></div>
<h1>Müşterin uygulama <em>indirmez.</em></h1>
<div class="kartlar">
  <div class="kart"><i>1</i><div><b>Müşteri yazar</b><span>Senin WhatsApp numarana, sesli bile.</span></div></div>
  <div class="kart"><i>2</i><div><b>SıraGO cevaplar</b><span>Boş saati söyler, randevuyu yazar.</span></div></div>
  <div class="kart"><i>3</i><div><b>Sen panelde görürsün</b><span>Makası bırakmadan, telefondan.</span></div></div>
</div>
<img class="tilki" src="../../varliklar/tilki-3d-temiz.png" alt="">
<div class="cagri"><b>Ücretsiz dene.</b><span>Kart bilgisi istenmez.<br>Bağlantı profilde.</span></div>
</body></html>
