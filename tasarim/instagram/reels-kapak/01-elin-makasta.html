<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../sistem/marka.css">
<style>
  /* Profil ızgarasında yalnız orta 1080×1440 (y 240–1680) görünür: her şey bu alanda. */
  body { --w: 1080px; --h: 1920px; --isik: 50% 70%; }
  .ust { top: 300px; }
  h1 { position: absolute; top: 420px; left: var(--kenar); right: var(--kenar); }
  .yigin { position: absolute; left: var(--kenar); right: var(--kenar); top: 960px; display: grid; gap: 18px; }
  .bld { display: grid; grid-template-columns: 72px 1fr; gap: 22px; align-items: center; padding: 24px 28px; border-radius: 34px; background: rgba(30,46,38,.86); border: 1.5px solid rgba(255,255,255,.12); }
  .bld .app { width: 72px; height: 72px; border-radius: 20px; background: #25d366; display: grid; place-items: center; color: #fff; font-size: 40px; }
  .bld b { font-size: 31px; font-weight: 700; display: block; }
  .bld span { font-size: 29px; color: #c9d4ce; }
  .bld:nth-child(2) { opacity: .75; } .bld:nth-child(3) { opacity: .5; }
  .seri { position: absolute; top: 1540px; left: var(--kenar); font-size: 24px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; color: var(--gri-k); }
</style></head>

  <div class="bld"><span class="app"><svg class="ik"><use href="#sohbet"/></svg></span><div><b>Kerem</b><span>Cumartesi kaçta boşsun?</span></div></div>
</div>
