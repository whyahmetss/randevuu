<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../sistem/marka.css">
<style>
  /* Instagram profil ekranı benzetimi: bio, öne çıkanlar, 9'lu grid (en yeni sol üstte; ızgara 3:4 kırpar) */
  body { --w: 1080px; --h: auto; background: #000; color: #f5f5f5; font-family: var(--f-govde), 'Noto Color Emoji'; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 40px 24px; font-size: 40px; font-weight: 700; }
  .bas { display: grid; grid-template-columns: 230px 1fr; gap: 40px; align-items: center; padding: 10px 40px 0; }
  .pp { width: 230px; height: 230px; border-radius: 50%; background: url(../../maskot/marka/profil-instagram-whatsapp.png) center/cover; }
  .say { display: flex; gap: 60px; font-size: 30px; } .say b { display: block; font-size: 38px; }
  .bio { padding: 26px 40px 0; font-size: 31px; line-height: 1.42; white-space: pre-line; }
  .bio b { font-weight: 700; } .bio .kat { color: #a8a8a8; display: block; }
  .bio a { color: #e0f1ff; font-weight: 600; text-decoration: none; display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .dug { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 30px 40px 0; }
  .dug span { background: #262626; border-radius: 16px; text-align: center; padding: 20px; font-size: 29px; font-weight: 600; }
  .oc { display: flex; gap: 30px; padding: 40px 40px 34px; overflow: hidden; }
  .oc div { text-align: center; font-size: 25px; width: 150px; flex: none; }
  .oc i { display: block; width: 150px; height: 150px; border-radius: 50%; border: 3px solid #363636; padding: 6px; background-clip: content-box; margin-bottom: 12px; }
  .sekme { display: flex; justify-content: space-around; border-top: 1px solid #262626; padding: 22px 0; font-size: 26px; color: #a8a8a8; }
  .sekme b { color: #fff; border-bottom: 3px solid #fff; padding-bottom: 18px; margin-bottom: -22px; }
  .izgara { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .izgara div { aspect-ratio: 3 / 4; background-size: cover; background-position: center; position: relative; }
  .izgara div.r::after { content: ''; position: absolute; top: 18px; right: 18px; width: 0; height: 0; border-left: 26px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .izgara div.c::after { content: ''; position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border: 4px solid #fff; border-radius: 6px; box-shadow: -8px 8px 0 -2px rgba(255,255,255,.0); filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .no { position: absolute; left: 14px; bottom: 12px; font-size: 22px; font-weight: 700; background: rgba(0,0,0,.65); color: #fff; padding: 4px 12px; border-radius: 10px; }
</style></head>
<body data-w="1080" data-h="auto">
<div class="izgara">
  <div class="r" style="background-image:url(reels-kapak/03-gece-2347.png)"></div>
  <div style="background-image:url(gonderi/08-oncu-esnaf/gonderi.png)"></div>
  <div class="c" style="background-image:url(gonderi/07-hatirlatma/1-kapak.png)"></div>
  <div class="c" style="background-image:url(gonderi/06-kurulum-4-adim/1-kapak.png)"></div>
  <div class="r" style="background-image:url(reels-kapak/02-cumartesi-oglen.png)"></div>
  <div style="background-image:url(gonderi/03-bes-dakikaya-oradayim/gonderi.png)"></div>
  <div class="c" style="background-image:url(gonderi/01-makas-elindeyken/1-kapak.png)"></div>
  <div style="background-image:url(gonderi/02-suphelenmekte-haklisin/gonderi.png)"></div>
  <div class="r" style="background-image:url(reels-kapak/01-elin-makasta.png)"></div>
</div>
</body></html>
