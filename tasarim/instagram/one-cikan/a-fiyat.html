<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../sistem/marka.css">
<style>
  body { --w: 1080px; --h: 1920px; display: grid; place-items: center; }
  /* Instagram öne çıkan kapakta ortadaki daireyi gösterir: içerik merkez 600px dairede */
  .daire { width: 760px; height: 760px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; position: relative; }
  .z-gece .daire { background: radial-gradient(circle at 50% 40%, #16291f, var(--gece) 70%); }
  .z-krem .daire { background: var(--krem); }
  .tilki-yuz { position: absolute; inset: 0; background: url(../../varliklar/tilki-3d-temiz.png) no-repeat; background-size: 1180px auto; background-position: 46% 4%; }
</style></head>
<body class="z-gece" data-w="1080" data-h="1920"><script src="../../sistem/ikonlar.js"></script>
<div class="daire"><svg class="ik" style="font-size:340px;color:var(--vurgu);stroke-width:1.6"><use href="#etiket"/></svg></div>
</body></html>
